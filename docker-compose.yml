services:
  notificaciones-db:
    image: postgres:16-alpine
    container_name: styleradar-notificaciones-db
    environment:
      POSTGRES_DB: ${DB_NAME:-notificaciones_db}
      POSTGRES_USER: ${DB_USER:-styleradar_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-styleradar_secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - notificaciones_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-styleradar_user} -d ${DB_NAME:-notificaciones_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - styleradar-net

  notificaciones-redis:
    image: redis:7-alpine
    container_name: styleradar-notificaciones-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - styleradar-net

  event-broker:
    image: rabbitmq:3.13-management-alpine
    container_name: styleradar-event-broker
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - styleradar-net

  ms-notificaciones:
    build:
      context: .
      dockerfile: Dockerfile
    image: styleradar/ms-notificaciones:qa
    container_name: styleradar-ms-notificaciones
    ports:
      - "${PORT:-8088}:8088"
    environment:
      PORT: 8088
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: notificaciones-db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-notificaciones_db}
      DB_USER: ${DB_USER:-styleradar_user}
      DB_PASSWORD: ${DB_PASSWORD:-styleradar_secret}
      RABBITMQ_HOST: event-broker
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      REDIS_HOST: notificaciones-redis
      REDIS_PORT: 6379
      CATALOG_SERVICE_URL: ${CATALOG_SERVICE_URL:-http://host.docker.internal:8085}
      JWT_SECRET: ${JWT_SECRET:-clave_secreta_minimo_256_bits_para_firmado_seguro_hs256_styleradar_2026}
    depends_on:
      notificaciones-db:
        condition: service_healthy
      notificaciones-redis:
        condition: service_healthy
      event-broker:
        condition: service_healthy
    networks:
      - styleradar-net

volumes:
  notificaciones_pgdata:

networks:
  styleradar-net:
    driver: bridge
