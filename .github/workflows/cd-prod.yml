name: CD / PROD Pipeline - ms-notificaciones

on:
  push:
    branches: [ "main" ]

env:
  ACTIONS_SILENCE_NODE20_DEPRECATION_WARNING: 'true'

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Verify tests and JaCoCo >= 85%
        run: mvn -B clean verify

      - name: Build Production OCI Image
        run: docker build -t styleradar/ms-notificaciones:latest .

