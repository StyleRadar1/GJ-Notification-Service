name: CI / QA Pipeline - ms-notificaciones

on:
  push:
    branches: [ "develop", "Scaffolding", "feature/**" ]
  pull_request:
    branches: [ "develop", "main", "Scaffolding" ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Execute Maven Verify and JaCoCo Coverage Gate (>= 85%)
        run: mvn -B clean verify

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  docker-publish-qa:
    needs: build-and-verify
    if: (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/Scaffolding') && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build OCI Docker image for QA
        run: docker build -t styleradar/ms-notificaciones:qa .

