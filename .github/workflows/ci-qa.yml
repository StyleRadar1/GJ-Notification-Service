name: CI / QA Pipeline - ms-notificaciones

on:
  push:
    branches: [ "develop", "Scaffolding", "feature/**" ]
  pull_request:
    branches: [ "develop", "main", "Scaffolding" ]

env:
  ACTIONS_SILENCE_NODE20_DEPRECATION_WARNING: 'true'

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Execute Maven Verify and JaCoCo Coverage Gate (>= 85%)
        run: mvn -B clean verify

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  docker-verify-qa:
    needs: build-and-verify
    if: (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/Scaffolding') && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build OCI Docker image for QA
        run: docker build -t styleradar/ms-notificaciones:qa .

      - name: Verify Docker Compose stack health (NOT-18 Evidence)
        run: |
          sudo systemctl stop postgresql redis || true
          cp .env.example .env
          docker compose up -d
          echo 'Esperando que el servicio responda en /actuator/health...'
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8088/actuator/health; then
              echo
              docker compose ps
              exit 0
            fi
            sleep 5
          done
          echo 'El servicio no respondio correctamente en /actuator/health'
          docker compose ps
          docker compose logs --tail=100 ms-notificaciones
          exit 1

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down -v
