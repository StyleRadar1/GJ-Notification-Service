# A03 (cadena de suministro): Dependabot revisa cada semana las dependencias de Maven, las acciones de
# GitHub Actions y la imagen base de Docker, y abre un PR por cada actualizacion de seguridad o version.
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    target-branch: "develop"
    labels: ["dependencies"]
    groups:
      spring-boot:
        patterns: ["org.springframework.boot*", "org.springframework*"]
    # Spring Boot 3.2 / Java 21: las versiones mayores se revisan a mano
    ignore:
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
      # Spring Cloud 2025.1 y springdoc 3 exigen Spring Boot 4; con Boot 3.5 se queda en 2025.0.x y 2.8.x
      - dependency-name: "org.springframework.cloud:spring-cloud-dependencies"
        versions: [">= 2025.1"]
      - dependency-name: "org.springdoc:*"
        versions: [">= 2.9.0"]
      # jjwt 0.12+ cambia la API de parseo y firma; se mantiene 0.11.5 compatible con ms-auth
      - dependency-name: "io.jsonwebtoken:*"
        versions: [">= 0.12.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "develop"
    labels: ["dependencies", "ci"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "develop"
    labels: ["dependencies", "docker"]
