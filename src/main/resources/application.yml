server:
  port: ${PORT:8088}

spring:
  application:
    name: ms-notificaciones
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET:clave_secreta_minimo_256_bits_para_firmado_seguro_hs256_styleradar_2026}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  messaging:
    exchange: ${RABBITMQ_EXCHANGE:styleradar.exchange}
    dlx: ${RABBITMQ_DLX:styleradar.dlx}
    queues:
      inventory-updated: styleradar.notificaciones.inventario-actualizado.q
      garment-published: styleradar.notificaciones.prenda-publicada.q
      user-status-changed: styleradar.notificaciones.usuario-estado.q
      saved-search-synced: styleradar.notificaciones.busqueda-guardada.q
      message-sent: styleradar.notificaciones.mensaje-enviado.q
      donation-changed: styleradar.notificaciones.donacion-cambiada.q
      moderation-changed: styleradar.notificaciones.moderacion-cambiada.q
      dlq: styleradar.notificaciones.dlq
    routing-keys:
      inventory-updated: styleradar.inventario.actualizado
      garment-published: styleradar.catalogo.prenda.publicada
      garment-deleted: styleradar.catalogo.prenda.retirada
      user-status-changed: styleradar.usuarios.estado.cambiado
      saved-search-synced: styleradar.usuarios.busqueda.sincronizada
      message-sent: styleradar.chat.mensaje.enviado
      donation-changed: styleradar.donaciones.estado.cambiado
      moderation-changed: styleradar.catalogo.moderacion.cambiada
      alert-created: styleradar.notificaciones.alerta.creada
      dlq: styleradar.notificaciones.error
  clients:
    catalog-url: ${CATALOG_SERVICE_URL:http://localhost:8085}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
