server:
  port: ${PORT:8300}

spring:
  application:
    name: ms-notificaciones
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 3000
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

application:
  mail:
    from: ${MAIL_FROM:no-reply@styleradar.co}
    retry:
      max-attempts: 3
      initial-interval-ms: 1000
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  messaging:
    exchange: ${RABBITMQ_EXCHANGE:styleradar.exchange}
    dlx: ${RABBITMQ_DLX:styleradar.dlx}
    retry:
      max-attempts: 3
      initial-interval-ms: 1000
      multiplier: 2.0
      max-interval-ms: 10000
    queues:
      inventory-updated: styleradar.notificaciones.inventario-actualizado.q
      garment-published: styleradar.notificaciones.prenda-publicada.q
      user-status-changed: styleradar.notificaciones.usuario-estado.q
      saved-search-synced: styleradar.notificaciones.busqueda-guardada.q
      message-sent: styleradar.notificaciones.mensaje-enviado.q
      donation-changed: styleradar.notificaciones.donacion-cambiada.q
      moderation-changed: styleradar.notificaciones.moderacion-cambiada.q
      garment-deleted: styleradar.notificaciones.prenda-retirada.q
      donation-requested: styleradar.notificaciones.solicitud-donacion.q
      garment-sold: styleradar.notificaciones.prenda-vendida.q
      payment-confirmed: styleradar.notificaciones.pago-confirmado.q
      dlq: styleradar.notificaciones.dlq
    routing-keys:
      inventory-updated: styleradar.inventario.actualizado
      garment-published: styleradar.catalogo.prenda.publicada
      garment-deleted: styleradar.catalogo.prenda.retirada
      donation-requested: styleradar.donaciones.solicitud.creada
      garment-sold: styleradar.segundavida.prenda.vendida
      payment-confirmed: styleradar.pagos.pago.confirmado
      user-status-changed: styleradar.usuarios.estado.cambiado
      saved-search-synced: styleradar.usuarios.busqueda.sincronizada
      message-sent: styleradar.chat.mensaje.enviado
      donation-changed: styleradar.donaciones.estado.cambiado
      moderation-changed: styleradar.catalogo.moderacion.cambiada
      alert-created: styleradar.notificaciones.alerta.creada
      dlq: styleradar.notificaciones.error
  clients:
    catalog-url: ${CATALOG_SERVICE_URL:http://localhost:8220}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
